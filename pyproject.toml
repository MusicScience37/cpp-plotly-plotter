[project]
name = "cpp-plotly-plotter"
version = "0.0.0"
description = ""
readme = "README.md"
authors = [
    { name = "Kenta Kabashima", email = "kenta_program37@hotmail.co.jp" },
]
requires-python = ">=3.12,<3.14"
dependencies = ["setuptools (>=82.0.1,<83.0.0)"]

[tool.poetry]
packages = [{ include = "cpp_plotly_plotter_docs_helper", from = "scripts" }]

[tool.poetry.group.test.dependencies]
click = "^8.4.2"
playwright = "^1.61.0"

[tool.poetry.group.doc.dependencies]
sphinx = "^9.1.0"
breathe = "^4.36.0"
sphinx-orange-book-theme = "^0.21.0"
sphinxcontrib-plantuml = "^0.31"
myst-parser = "^5.1.0"
myst-nb = "^1.4.0"
jupyterlab = "^4.6.1"
ipywidgets = "^8.1.8"
ipython = "^9.15.0"
ipykernel = "^7.3.0"
plotly = "^6.8.0"
sphinx-togglebutton = "^0.4.5"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.0"
black = "^26.5.1"
cmakelang = "^0.6.13"
doc8 = "^2.0.0"
sphinx-autobuild = "^2025.8.25"
clang-tidy-checker = "^0.6.0"
lcov_cobertura = "^2.1.1"
pylint = "^4.0.6"
mypy = "^2.1.0"
flake8 = "^7.3.0"
isort = "^8.0.1"
pydocstyle = "^6.3.0"
pytest = "^9.1.1"
djlint = "^1.40.1"
tqdm = "^4.68.3"
types-tqdm = "^4.68.0.20260608"
pyyaml = "^6.0.3"
types-pyyaml = "^6.0.12.20260518"
ok-palette-lab = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.pylint.main]
disable = "too-many-instance-attributes,line-too-long,global-variable-not-assigned,duplicate-code"
